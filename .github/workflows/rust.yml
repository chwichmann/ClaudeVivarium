name: Build

on:
  push:
    branches: [main]
    paths: ["app/**", "core/**", "themes/**", "Cargo.toml", "Cargo.lock", "*.sh", "*.ps1", "*.cmd", "*.service", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["app/**", "core/**", "themes/**", "Cargo.toml", "Cargo.lock", "*.sh", "*.ps1", "*.cmd", "*.service", ".github/workflows/rust.yml"]
  workflow_dispatch:

# attestations: a signed statement that a downloaded program was built by this workflow from this
# commit (check with: gh attestation verify <file> --repo chwichmann/ClaudeVivarium)
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            binary: claude-vivarium-rs
          - os: macos-latest
            name: macos-arm64
            binary: claude-vivarium-rs
          - os: ubuntu-24.04-arm
            name: linux-arm64
            binary: claude-vivarium-rs
          - os: windows-latest
            name: windows-x86_64
            binary: claude-vivarium-rs.exe
          - os: windows-11-arm
            name: windows-arm64
            binary: claude-vivarium-rs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Software Vulkan for the render test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Draws every theme without a window. The build machines have no real graphics card, so a
      # failure here does not fail the build; the PNGs are uploaded when it works.
      - name: Render every theme
        continue-on-error: true
        shell: bash
        run: |
          cp target/release/${{ matrix.binary }} render-test${{ runner.os == 'Windows' && '.exe' || '' }}
          ./render-test render --demo --sysmon --themes all --times 12 --size 1600x1000 --out preview > render.log 2>&1 || true
          cat render.log || true
          ls preview || true
      - name: Windows screen saver file
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/claude-vivarium-rs.exe target/release/ClaudeVivariumRS.scr
      - name: Attest the build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/${{ matrix.binary }}
            target/release/ClaudeVivariumRS.scr
      - uses: actions/upload-artifact@v4
        with:
          name: claude-vivarium-rs-${{ matrix.name }}
          path: |
            target/release/${{ matrix.binary }}
            target/release/ClaudeVivariumRS.scr
            install-mac.sh
            install-linux.sh
            test-windows.cmd
            test-linux.sh
            claude-vivarium-rs.service
            preview/*.png
          if-no-files-found: warn
